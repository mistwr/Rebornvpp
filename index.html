<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reborn AI - Treino Inteligente de Vendas</title>
<style>
html, body {
  margin:0; padding:0; height:100%;
  font-family:'Helvetica', sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display:flex; justify-content:center; align-items:center;
}
.top-bar {
  position:fixed; top:0; left:0; width:100%;
  padding:10px 20px; background: rgba(0,0,0,0.9);
  display:flex; justify-content:center; align-items:center;
  z-index:1000; box-shadow:0 0 20px #0ff;
}
.top-bar .logo-text {
  font-size:2rem; font-weight:bold; color:#0ff;
  text-shadow:0 0 5px #0ff,0 0 15px #0ff,0 0 30px #0ff;
  animation: glow 1.5s infinite alternate;
}
@keyframes glow {
  from { text-shadow:0 0 5px #0ff,0 0 15px #0ff,0 0 30px #0ff; }
  to { text-shadow:0 0 15px #0ff,0 0 30px #0ff,0 0 60px #0ff; }
}

.login-box {
  background: rgba(0,0,0,0.95);
  padding: 60px 30px 40px 30px;
  border-radius:25px;
  text-align:center;
  max-width:450px;
  width:90%;
  box-shadow:0 0 50px #0ff;
  animation: fadeIn 1s ease-in-out;
}
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

.slideshow { width:100%; max-height:220px; border-radius:15px; margin-bottom:20px; overflow:hidden; }
.slideshow img { width:100%; display:none; border-radius:15px; opacity:0; transition:opacity 1s ease-in-out; }
.slideshow img.active { display:block; opacity:1; }

h1 { color:#0ff; margin-bottom:12px; text-shadow:0 0 10px #0ff,0 0 25px #0ff,0 0 50px #0ff; font-size:1.8rem; }
#motivation { color:#0ff; font-weight:bold; font-size:1.1rem; min-height:28px; margin-bottom:15px; }

button {
  width:100%; padding:12px; background:#0ff; color:#000; font-weight:bold;
  border:none; border-radius:10px; font-size:1rem; cursor:pointer;
  box-shadow:0 0 20px #0ff; transition:all 0.3s ease; margin-bottom:10px;
}
button:hover { transform:scale(1.1); box-shadow:0 0 35px #0ff; }

/* Modal eBook */
.modal {
  display:none; position:fixed; z-index:1000; left:0; top:0;
  width:100%; height:100%; background: rgba(0,0,0,0.95);
  color:#0ff; justify-content:center; align-items:center;
}
.modal-content {
  max-width:650px; width:90%; background:#111; padding:20px;
  border-radius:15px; text-align:left; position:relative;
}
.close-modal {
  position:absolute; top:10px; right:15px; font-size:1.5rem; cursor:pointer; color:#0ff;
}
.slide { display:none; }
.slide.active { display:block; }
.slide h2 { margin-top:0; color:#0ff; }
.slide p { color:#ccc; font-size:1rem; }
.slide-buttons { text-align:center; margin-top:15px; }

/* Chatbox Reborn AI */
#trainBox {
  display:none; position:fixed; bottom:20px; right:20px;
  width:360px; max-height:480px; background:#111; border-radius:15px;
  box-shadow:0 0 35px #0ff; padding:10px;
  overflow-y:auto; color:#0ff; flex-direction:column;
  display:flex;
}
#trainMessages { margin-bottom:10px; max-height:330px; overflow-y:auto; }
#trainMessages div { margin:5px 0; }
#trainInput {
  width:100%; padding:8px; border-radius:10px; border:none;
  margin-bottom:5px; background:#222; color:#0ff;
}
</style>
</head>
<body>

<div class="top-bar"><div class="logo-text">Reborn AI</div></div>

<div class="login-box">
  <div class="slideshow">
    <img src="https://images.pexels.com/photos/3183186/pexels-photo-3183186.jpeg?auto=compress&cs=tinysrgb&w=600" class="active">
    <img src="https://images.pexels.com/photos/3183197/pexels-photo-3183197.jpeg?auto=compress&cs=tinysrgb&w=600">
    <img src="https://images.pexels.com/photos/3184300/pexels-photo-3184300.jpeg?auto=compress&cs=tinysrgb&w=600">
  </div>

  <h1>Hora de Vender! 🚀</h1>
  <div id="motivation">Motivação e resultados estão aqui!</div>

  <button id="openEbook">O que é o Reborn AI?</button>
  <button id="trainBtn">Treinar com Reborn AI</button>
</div>

<!-- Modal eBook -->
<div id="ebookModal" class="modal">
  <div class="modal-content">
    <span class="close-modal" id="closeEbook">&times;</span>
    <div class="slide active">
      <h2>O que é o Reborn AI?</h2>
      <p>Uma IA que automatiza tarefas, marketing, SMS, WhatsApp e ajuda a vender mais.</p>
    </div>
    <div class="slide">
      <h2>Benefícios</h2>
      <p>Mais tempo para focar no fechamento de negócios e bater metas de vendas.</p>
    </div>
    <div class="slide-buttons">
      <button id="prevSlide">⬅️ Anterior</button>
      <button id="nextSlide">Próximo ➡️</button>
    </div>
  </div>
</div>

<!-- Chatbox Treino Reborn AI -->
<div id="trainBox">
  <div id="trainMessages"></div>
  <input id="trainInput" placeholder="Treinar com Reborn AI..." />
  <button id="trainSend">Enviar</button>
</div>

<script type="module">
// Slideshow
let slidesSS = document.querySelectorAll('.slideshow img');
let currentSS = 0;
setInterval(()=>{
  slidesSS[currentSS].classList.remove('active');
  currentSS = (currentSS+1) % slidesSS.length;
  slidesSS[currentSS].classList.add('active');
},3000);

// Motivação
const motivations = [
  "Feche negócios como nunca! 💥",
  "Seja o líder que inspira! 🚀",
  "Automatize tarefas e venda mais! 💡",
  "Bata metas e conquiste resultados extraordinários!"
];
let motIndex = 0;
setInterval(()=>{
  document.getElementById('motivation').textContent = motivations[motIndex];
  motIndex = (motIndex+1) % motivations.length;
},4000);

// Modal eBook
const modal=document.getElementById('ebookModal');
document.getElementById('openEbook').addEventListener('click',()=>{ modal.style.display='flex'; });
document.getElementById('closeEbook').addEventListener('click',()=>{ modal.style.display='none'; });
let slideIndex=0;
const slides=modal.querySelectorAll('.slide');
function showSlide(index){ slides.forEach(s=>s.classList.remove('active')); slides[index].classList.add('active'); }
document.getElementById('prevSlide').addEventListener('click',()=>{ slideIndex=(slideIndex-1+slides.length)%slides.length; showSlide(slideIndex); });
document.getElementById('nextSlide').addEventListener('click',()=>{ slideIndex=(slideIndex+1)%slides.length; showSlide(slideIndex); });

// Treino Reborn AI usando modelo em browser
document.getElementById('trainBtn').addEventListener('click',()=>{ document.getElementById('trainBox').style.display='flex'; });

document.getElementById('trainSend').addEventListener('click', async()=>{
  const input = document.getElementById('trainInput').value.trim();
  if(!input) return;
  const msgs=document.getElementById('trainMessages');
  msgs.innerHTML += `<div><b>Você:</b> ${input}</div>`;
  document.getElementById('trainInput').value='';

  // Resposta automatizada sem backend
  let reply="Reborn AI Treino: Foco em benefícios e conquiste a confiança do cliente!";
  if(input.toLowerCase().includes("porta a porta")) reply="Porta a porta: abordagem positiva, valor imediato, confiança!";
  if(input.toLowerCase().includes("call center")) reply="Call center: escute, responda soluções, seja empático!";
  if(input.toLowerCase().includes("telemarketing")) reply="Telemarketing: destaque valor, seja breve e claro!";
  if(input.toLowerCase().includes("lider")) reply="Líder: motive equipe, defina metas claras e feedback diário!";

  msgs.innerHTML += `<div><b>Reborn AI:</b> ${reply}</div>`;
  msgs.scrollTop=msgs.scrollHeight;
});
</script>

</body>
</html>

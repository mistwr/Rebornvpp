<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reborn AI - Potencialize Suas Vendas!</title>
<style>
  html, body {
    margin:0; padding:0; height:100%;
    font-family: 'Helvetica', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display:flex; justify-content:center; align-items:center;
  }

  .login-box {
    position:relative;
    background: rgba(0,0,0,0.9);
    padding:40px 30px;
    border-radius:25px;
    text-align:center;
    max-width:400px;
    width:90%;
    box-shadow: 0 0 40px #0ff;
  }

  .logo-text {
    font-size:2rem;
    font-weight:bold;
    color:#0ff;
    text-shadow: 0 0 5px #0ff, 0 0 15px #0ff, 0 0 30px #0ff;
    margin-bottom:20px;
    display:inline-block;
    animation: glow 1.5s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { text-shadow: 0 0 5px #0ff, 0 0 15px #0ff, 0 0 30px #0ff; }
    to { text-shadow: 0 0 15px #0ff, 0 0 30px #0ff, 0 0 60px #0ff; }
  }

  .slideshow {
    width:100%; max-height:200px; border-radius:15px; margin-bottom:20px;
    overflow:hidden;
  }
  .slideshow img {
    width:100%; display:none; border-radius:15px;
  }
  .slideshow img.active { display:block; }

  h1 {
    color:#0ff; margin-bottom:12px;
    text-shadow: 0 0 5px #0ff,0 0 15px #0ff,0 0 30px #0ff;
  }

  p { color:#ccc; margin-bottom:25px; font-size:1rem; }

  input[type="password"] {
    width:100%; padding:12px; border-radius:10px; border:none;
    margin-bottom:15px; text-align:center; background: rgba(255,255,255,0.1);
    color:#fff; font-weight:bold;
  }
  input::placeholder { color:rgba(255,255,255,0.7); }

  button {
    width:100%; padding:12px; background:#0ff; color:#000; font-weight:bold;
    border:none; border-radius:10px; font-size:1rem; cursor:pointer;
    box-shadow:0 0 15px #0ff; transition: all 0.3s ease;
  }
  button:hover {
    transform: scale(1.05); box-shadow:0 0 25px #0ff;
  }

  .error { color:red; margin-top:10px; display:none; font-weight:bold; }
</style>
</head>
<body>

<div class="login-box">
  <div class="logo-text">Reborn AI</div>

  <!-- Slideshow -->
  <div class="slideshow">
    <img src="https://images.pexels.com/photos/3183186/pexels-photo-3183186.jpeg?auto=compress&cs=tinysrgb&w=600" class="active" alt="Líderes motivacionais">
    <img src="https://images.pexels.com/photos/3183197/pexels-photo-3183197.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Equipe em reunião">
    <img src="https://images.pexels.com/photos/3184300/pexels-photo-3184300.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Vendedores motivados">
  </div>

  <h1>Hora de Vender! 🚀</h1>
  <p>Use o Reborn AI para potencializar suas vendas, bater metas e conquistar resultados extraordinários!</p>

  <form id="loginForm">
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Entrar no Reborn AI</button>
  </form>

  <div id="error" class="error">Password incorreta!</div>
</div>

<script>
  // Slideshow automático
  let slides = document.querySelectorAll('.slideshow img');
  let current = 0;
  setInterval(() => {
    slides[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
  }, 3000);

  // Login
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const pwd = document.getElementById('password').value.trim();
    if(pwd !== 'reborn'){
      document.getElementById('error').style.display = 'block';
      return;
    }
    window.location.href = 'https://v0-ai-gateway-starter-zetaa-oneee.vercel.app/';
  });
</script>

</body>
</html>

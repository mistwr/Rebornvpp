<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reborn AI - Login Motivacional</title>
<style>
  html, body {
    margin:0;
    padding:0;
    height:100%;
    font-family: 'Helvetica', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .login-box {
    position:relative;
    background: rgba(0,0,0,0.85);
    padding:50px;
    border-radius:25px;
    text-align:center;
    max-width:400px;
    width:90%;
    box-shadow: 0 0 40px #0ff;
    animation: fadeIn 1.5s ease forwards;
  }

  @keyframes fadeIn {
    0% {opacity:0; transform: scale(0.8);}
    100% {opacity:1; transform: scale(1);}
  }

  .login-box img {
    width:150px;
    margin-bottom:20px;
    filter: drop-shadow(0 0 10px #0ff) drop-shadow(0 0 20px #0ff);
    animation: glow 2s ease-in-out infinite alternate;
  }

  @keyframes glow {
    0% {filter: drop-shadow(0 0 10px #0ff) drop-shadow(0 0 20px #0ff);}
    100% {filter: drop-shadow(0 0 20px #0ff) drop-shadow(0 0 40px #0ff);}
  }

  h1 {
    color:#0ff;
    margin-bottom:15px;
    text-shadow: 0 0 5px #0ff, 0 0 15px #0ff, 0 0 30px #0ff;
    animation: neon 1.5s ease-in-out infinite alternate;
  }

  @keyframes neon {
    0% { text-shadow: 0 0 5px #0ff,0 0 15px #0ff,0 0 30px #0ff; }
    100% { text-shadow: 0 0 10px #0ff,0 0 30px #0ff,0 0 60px #0ff; }
  }

  p { color:#ccc; margin-bottom:25px; }

  input[type="password"] {
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    margin-bottom:15px;
    text-align:center;
    background: rgba(255,255,255,0.1);
    color:#fff;
    font-weight:bold;
  }
  input::placeholder { color:rgba(255,255,255,0.7); }

  button {
    width:100%;
    padding:12px;
    background:#0ff;
    color:#000;
    font-weight:bold;
    border:none;
    border-radius:10px;
    font-size:1rem;
    cursor:pointer;
    box-shadow:0 0 15px #0ff;
    transition: all 0.3s ease;
  }
  button:hover {
    transform: scale(1.05);
    box-shadow:0 0 25px #0ff;
  }

  .error { color:red; margin-top:10px; display:none; font-weight:bold; }
</style>
</head>
<body>

<div class="login-box">
  <a href="https://v0-ai-gateway-starter-zetaa-oneee.vercel.app/" target="_blank">
    <img src="https://i.imgur.com/6qQnQwV.png" alt="Reborn AI Logo">
  </a>
  <h1>Boas Vendas! 🚀</h1>
  <p>Líderes e vendedores, esta é a hora de brilhar e alcançar resultados extraordinários!</p>
  <form id="loginForm">
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Entrar no Reborn AI</button>
  </form>
  <div id="error" class="error">Password incorreta!</div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const pwd = document.getElementById('password').value.trim();
    if(pwd !== 'reborn'){
      document.getElementById('error').style.display = 'block';
      return;
    }
    window.location.href = 'https://v0-ai-gateway-starter-zetaa-oneee.vercel.app/';
  });
</script>

</body>
</html>

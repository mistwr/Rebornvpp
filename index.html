<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reborn AI - Potencialize Suas Vendas</title>
<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
  font-family:'Helvetica',sans-serif;
  overflow-x:hidden;
  background:#000;
}

body {
  display:flex;
  justify-content:center;
  align-items:flex-start;
  flex-direction:column;
  position:relative;
  color:#fff;
}

/* Vídeo de fundo */
#bgVideo {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  object-fit:cover;
  z-index:-1;
}

/* Slideshow */
.slideshow {
  width:90%;
  max-width:700px;
  margin:20px auto;
  border-radius:15px;
  overflow:hidden;
}

.slideshow img {
  width:100%;
  display:none;
  border-radius:15px;
  object-fit:cover;
}

.slideshow img.active {
  display:block;
}

/* Caixa principal */
.login-box {
  background:rgba(0,0,0,0.85);
  padding:25px;
  border-radius:25px;
  text-align:center;
  max-width:600px;
  width:90%;
  margin:auto;
  box-shadow:0 0 50px #00ffff;
}

.logo-text {
  font-size:2rem;
  font-weight:bold;
  color:#00ffff;
  text-shadow:0 0 15px #00ffff,0 0 40px #00ffff;
  margin-bottom:15px;
  animation:pulseGlow 2s infinite;
}

@keyframes pulseGlow{
0%{text-shadow:0 0 10px #00ffff;}
50%{text-shadow:0 0 30px #00ffff;}
100%{text-shadow:0 0 10px #00ffff;}
}

h1 { color:#00ffff; margin-bottom:10px; }
p { color:#ccc; font-size:0.95rem; margin-bottom:15px; }

#rebornaisDesc {
  color:#00ffff; font-weight:bold; margin:15px 0; font-size:1rem; text-shadow:0 0 10px #00ffff;
}

/* Preços */
.price-wrapper{
  margin-top:15px;
}

.old-price{ color:#888; text-decoration:line-through; }
.new-price{
  font-size:2rem;
  color:#00ff88;
  font-weight:bold;
  text-shadow:0 0 25px #00ff88;
  animation:pricePulse 1.8s infinite;
}
@keyframes pricePulse{
0%{transform:scale(1);}
50%{transform:scale(1.06);}
100%{transform:scale(1);}
}
.limited{ color:#ff4444; font-weight:bold; font-size:0.9rem; margin-bottom:5px; }

/* Formulário password */
input[type="password"]{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-bottom:10px;
  text-align:center;
  background: rgba(255,255,255,0.1);
  color:#fff;
  font-weight:bold;
}
input::placeholder{ color:rgba(255,255,255,0.7); }
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(45deg,#00ffff,#0099ff);
  font-weight:bold;
  cursor:pointer;
  font-size:1rem;
  box-shadow:0 0 20px #00ffff;
  animation:breath 2s infinite;
  transition:0.3s;
  margin-bottom:10px;
}
button:hover{ transform:scale(1.05); }
@keyframes breath{
0%{box-shadow:0 0 15px #00ffff;}
50%{box-shadow:0 0 40px #00ffff;}
100%{box-shadow:0 0 15px #00ffff;}
}

/* Popup compras simuladas */
.popup{
  position:fixed;
  bottom:20px;
  left:20px;
  background:#111;
  color:#00ffff;
  padding:12px 18px;
  border-radius:12px;
  box-shadow:0 0 20px #00ffff;
  display:none;
  font-size:0.85rem;
  z-index:999;
}

/* Quiz */
.quiz-box{ background:rgba(0,0,0,0.85); padding:20px; margin:20px auto; border-radius:15px; max-width:600px;}
.quiz-box button{ margin:8px 5px; background:#00ffff; color:#000; font-weight:bold; cursor:pointer; }
.quiz-desc{ font-size:0.95rem; font-weight:bold; }

/* Responsividade */
@media(max-width:600px){
  .slideshow{max-height:200px;}
  .slideshow img{max-height:200px;}
  .new-price{font-size:1.6rem;}
  input[type="password"], button{padding:10px; font-size:0.9rem;}
}
</style>
</head>
<body>

<!-- Video de fundo do YouTube -->
<iframe id="bgVideo" src="https://www.youtube.com/embed/bO7UM84vCQ4?autoplay=1&mute=0&loop=1&playlist=bO7UM84vCQ4" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>

<div class="login-box">
  <div class="logo-text">Reborn AI</div>

  <!-- Slideshow de imagens -->
  <div class="slideshow">
    <img src="https://images.pexels.com/photos/3183186/pexels-photo-3183186.jpeg" class="active">
    <img src="https://images.pexels.com/photos/3183197/pexels-photo-3183197.jpeg">
    <img src="https://images.pexels.com/photos/3184300/pexels-photo-3184300.jpeg">
  </div>

  <h1>Hora de Vender 🚀</h1>
  <p>Automatize vendas, gere leads e escale resultados com inteligência.</p>

  <div id="rebornaisDesc">
  💡 O Reborn AI permite envio de SMS, WhatsApp e email massivo, criação de sites, ebooks e interação direta com vendas.
  </div>

  <div class="price-wrapper">
    <p class="old-price">Antes 69,99€</p>
    <div class="new-price">Agora 9,99€</div>
    <div class="limited">🔥 Oferta limitada</div>
    <a href="https://buy.stripe.com/eVqdR93RbaHQ4ecbk95Rm00" target="_blank">
      <button>🛒 Garantir Acesso Agora</button>
    </a>
  </div>

  <form id="loginForm">
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Entrar no Reborn AI</button>
  </form>

</div>

<!-- Quiz -->
<div class="quiz-box" id="quizBox">
  <div class="quiz-question" id="quizQuestion"></div>
  <div class="quiz-options" id="quizOptions"></div>
  <div class="quiz-desc" id="quizDesc" style="opacity:0; transition:opacity 0.7s;"></div>
</div>

<div class="popup" id="popup"></div>

<script>
// Slideshow
let slides = document.querySelectorAll(".slideshow img");
let current = 0;
setInterval(()=>{
  slides[current].classList.remove("active");
  current = (current+1)%slides.length;
  slides[current].classList.add("active");
},4000);

// Popup compras simuladas
const names=["Carlos","Mariana","Rafael","João","Ana","Miguel","Sofia","Tiago"];
function showPopup(){
  let name = names[Math.floor(Math.random()*names.length)];
  let popup = document.getElementById("popup");
  popup.innerHTML = "🔥 "+name+" acabou de comprar Reborn AI";
  popup.style.display = "block";
  setTimeout(()=>{popup.style.display="none";},4000);
}
setInterval(showPopup,7000);

// Login password
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const pwd = document.getElementById('password').value.trim();
  if(pwd !== 'reborn'){
    alert('Password incorreta!');
    return;
  }
  window.location.href = 'https://v0-crm-web-app-snowy.vercel.app/login';
});

// Quiz interativo
const questions = [
  {q:"Qual destas funcionalidades do Reborn AI ajuda a aumentar a produtividade?", a:["Envio de SMS massivo","Somente design de logotipo","Automação de emails e WhatsApp","Nada disso"], correct:[0,2], desc:"💡 Vantagem: Automatize comunicações e foque nas vendas."},
  {q:"Qual funcionalidade permite criar ebooks automaticamente?", a:["Sim","Não","Talvez","Nunca"], correct:[0], desc:"💡 Vantagem: Economize tempo criando materiais para clientes e leads."},
  {q:"Pode o Reborn AI enviar mensagens em massa pelo WhatsApp?", a:["Sim","Não","Apenas Email","Não aplica"], correct:[0], desc:"💡 Vantagem: Alcance milhares de clientes de forma automática."}
];
let qIndex=0;
const quizQ = document.getElementById('quizQuestion');
const quizO = document.getElementById('quizOptions');
const quizD = document.getElementById('quizDesc');

function loadQuestion(){
  quizD.style.opacity = 0;
  quizQ.innerHTML = questions[qIndex].q;
  quizO.innerHTML = "";
  questions[qIndex].a.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.innerText = opt;
    btn.onclick = ()=>{showNext(i)};
    quizO.appendChild(btn);
  });
}
function showNext(i){
  const correct = questions[qIndex].correct.includes(i);
  quizD.style.color = correct ? "#00ff88" : "#ff4444";
  quizD.innerHTML = (correct ? "✅ Correcto! " : "❌ Incorreto! ") + questions[qIndex].desc;
  quizD.style.opacity = 1;
  qIndex++;
  setTimeout(()=>{
    if(qIndex < questions.length){
      loadQuestion();
    } else {
      quizQ.innerHTML="🎉 Terminou o quiz! Explore e experimente o Reborn AI!";
      quizO.innerHTML="";
      quizD.style.opacity = 0;
    }
  },2000);
}
loadQuestion();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reborn AI - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
html, body {
  margin:0; padding:0; height:100%;
  font-family:'Orbitron', sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex; justify-content:center; align-items:center;
  overflow-x:hidden;
}
.login-box {
  position:relative; background:rgba(10,10,10,0.95);
  padding:30px 25px; border-radius:25px; text-align:center;
  max-width:400px; width:95%; box-shadow:0 0 50px #0ff;
  box-sizing:border-box; transition:all 0.3s ease;
  border:2px solid rgba(0,255,255,0.5);
}
.logo-text {
  font-size:2.2rem; font-weight:700; color:#0ff;
  text-shadow:0 0 10px #0ff,0 0 20px #0ff,0 0 40px #0ff;
  margin-bottom:25px; display:inline-block;
  animation:glow 1.5s ease-in-out infinite alternate;
}
@keyframes glow {
  from {text-shadow:0 0 10px #0ff,0 0 20px #0ff,0 0 40px #0ff;}
  to   {text-shadow:0 0 20px #0ff,0 0 40px #0ff,0 0 80px #0ff;}
}
.slideshow { width:100%; max-height:220px; border-radius:20px; margin-bottom:25px; overflow:hidden; position:relative;}
.slideshow img { width:100%; height:auto; position:absolute; top:0; left:0; opacity:0; transition:opacity 1.5s ease-in-out; border-radius:20px; box-shadow:0 0 20px #0ff;}
.slideshow img.active { opacity:1; z-index:1;}
h1 { color:#0ff; margin-bottom:15px; text-shadow:0 0 10px #0ff,0 0 20px #0ff; font-size:1.6rem;}
p { color:#ccc; margin-bottom:25px; font-size:1rem; line-height:1.4;}
input[type="password"] {
  width:100%; padding:14px; border-radius:12px; border:none;
  margin-bottom:18px; text-align:center; background: rgba(0,255,255,0.08);
  color:#fff; font-weight:bold; box-sizing:border-box;
  font-size:1rem; box-shadow:0 0 10px rgba(0,255,255,0.3);
  transition: all 0.3s ease;
}
input:focus { outline:none; background: rgba(0,255,255,0.15); box-shadow:0 0 20px #0ff;}
input::placeholder { color:rgba(255,255,255,0.6);}
button {
  width:100%; padding:14px; background:linear-gradient(45deg,#0ff,#00ffff);
  color:#000; font-weight:bold; border:none; border-radius:12px; font-size:1rem;
  cursor:pointer; box-shadow:0 0 20px #0ff; transition: all 0.3s ease; margin-bottom:12px;
}
button:hover { transform: scale(1.05); box-shadow:0 0 40px #0ff;}
.error { color:red; margin-top:12px; display:none; font-weight:bold; font-size:0.95rem; text-shadow:0 0 5px #f00;}
.progress-bar-container { width:100%; height:10px; background:rgba(255,255,255,0.1); border-radius:5px; margin-top:12px; display:none; box-shadow:inset 0 0 5px #0ff;}
.progress-bar { width:0%; height:100%; background:#0ff; border-radius:5px; transition:width 0.3s ease; }

/* Fade total para redirecionamento */
#fadeScreen {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#000; opacity:0; pointer-events:none; z-index:2000;
  transition:opacity 0.8s ease;
}

/* Responsividade geral */
@media(max-width:700px){
  .login-box { padding:25px 15px; }
  .logo-text { font-size:1.8rem; }
  h1 { font-size:1.4rem; }
  p { font-size:0.95rem; }
  input[type="password"] { font-size:0.95rem; padding:12px; }
  button { font-size:0.95rem; padding:12px; }
}
@media(max-width:400px){
  .logo-text { font-size:1.5rem; }
  h1 { font-size:1.2rem; }
  p { font-size:0.9rem; }
  input[type="password"] { font-size:0.9rem; padding:10px; }
  button { font-size:0.9rem; padding:10px; }
}
</style>
</head>
<body>

<div id="fadeScreen"></div>

<div class="login-box">
  <div class="logo-text">Reborn AI</div>

  <div class="slideshow">
    <img src="https://i.ibb.co/9sX8W9r/img1.jpg" class="active">
    <img src="https://i.ibb.co/VpR5xH2/img2.jpg">
    <img src="https://i.ibb.co/ZH5kqDQ/img3.jpg">
  </div>

  <h1>Hora de Vender! 🚀</h1>
  <p>Use o Reborn AI para potencializar sua performance comercial.</p>

  <!-- Login com password -->
  <form id="loginForm">
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Entrar no Reborn AI</button>
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
  </form>

  <div id="error" class="error">Password incorreta!</div>
</div>

<script>
// Slideshow corrigido
let slides=document.querySelectorAll('.slideshow img');
let current=0;
function nextSlide(){
  slides.forEach(img=>img.classList.remove('active'));
  current=(current+1)%slides.length;
  slides[current].classList.add('active');
}
setInterval(nextSlide,4000);

// Login + redirecionamento
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const pwd = document.getElementById('password').value.trim();
  const errorEl = document.getElementById('error');
  const progressContainer = document.querySelector('.progress-bar-container');
  const progressBar = document.querySelector('.progress-bar');
  const fadeScreen = document.getElementById('fadeScreen');

  errorEl.style.display='none';

  if(pwd!=='reborn'){ 
    errorEl.style.display='block'; 
    return; 
  }

  progressContainer.style.display='block';
  progressBar.style.width='0%';
  let width=0;
  const interval=setInterval(()=>{
    if(width>=100){
      clearInterval(interval);
      fadeScreen.style.opacity='1';
      fadeScreen.style.pointerEvents='auto';
      setTimeout(()=>window.location.href='https://v0-ai-gateway-starter-zetaa-oneee.vercel.app/',800);
    }
    width+=2;
    progressBar.style.width=width+'%';
  },30);
});

// Tracker de visitas oculto
(function(){
  let visits=localStorage.getItem('reborn_visits')||0;
  visits++;
  localStorage.setItem('reborn_visits',visits);
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reborn AI - Potencialize Suas Vendas!</title>
<style>
html, body { margin:0; padding:0; height:100%; font-family: 'Helvetica', sans-serif;
background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
display:flex; justify-content:center; align-items:center; color:#fff; }

.login-box { position:relative; background: rgba(0,0,0,0.9); padding:40px 30px;
border-radius:25px; text-align:center; max-width:400px; width:90%; box-shadow: 0 0 40px #0ff; }

.logo-text { font-size:2rem; font-weight:bold; color:#0ff;
text-shadow: 0 0 5px #0ff, 0 0 15px #0ff, 0 0 30px #0ff; margin-bottom:20px;
display:inline-block; animation: glow 1.5s ease-in-out infinite alternate; }

@keyframes glow { from { text-shadow: 0 0 5px #0ff, 0 0 15px #0ff, 0 0 30px #0ff; } to { text-shadow: 0 0 15px #0ff, 0 0 30px #0ff, 0 0 60px #0ff; } }

.slideshow { width:100%; max-height:200px; border-radius:15px; margin-bottom:20px; overflow:hidden; }
.slideshow img { width:100%; display:none; border-radius:15px; }
.slideshow img.active { display:block; }

h1 { color:#0ff; margin-bottom:12px; text-shadow: 0 0 5px #0ff,0 0 15px #0ff,0 0 30px #0ff; }
p { color:#ccc; margin-bottom:25px; font-size:1rem; }

input[type="password"], textarea { width:100%; padding:12px; border-radius:10px; border:none; margin-bottom:15px; text-align:center; background: rgba(255,255,255,0.1); color:#fff; font-weight:bold; }
textarea { resize:none; text-align:left; }

input::placeholder, textarea::placeholder { color:rgba(255,255,255,0.7); }

button { width:100%; padding:12px; background:#0ff; color:#000; font-weight:bold; border:none; border-radius:10px; font-size:1rem; cursor:pointer; box-shadow:0 0 15px #0ff; transition: all 0.3s ease; margin-bottom:10px; }
button:hover { transform: scale(1.05); box-shadow:0 0 25px #0ff; }

.error { color:red; margin-top:10px; display:none; font-weight:bold; }

.modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background: rgba(0,0,0,0.95); color:#0ff; justify-content:center; align-items:center; }
.modal-content { max-width:600px; width:90%; background:#111; padding:20px; border-radius:15px; text-align:left; position:relative; }
.close-modal { position:absolute; top:10px; right:15px; font-size:1.5rem; cursor:pointer; color:#0ff; }
.slide { display:none; } .slide.active { display:block; } .slide h2 { margin-top:0; color:#0ff; } .slide p { color:#ccc; font-size:1rem; } .slide-buttons { text-align:center; margin-top:15px; }
</style>
</head>
<body>

<audio id="motivationalAudio" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="login-box">
  <div class="logo-text">Reborn AI</div>

  <div class="slideshow">
    <img src="https://images.pexels.com/photos/3183186/pexels-photo-3183186.jpeg?auto=compress&cs=tinysrgb&w=600" class="active" alt="Líderes motivacionais">
    <img src="https://images.pexels.com/photos/3183197/pexels-photo-3183197.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Equipe em reunião">
    <img src="https://images.pexels.com/photos/3184300/pexels-photo-3184300.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Vendedores motivados">
  </div>

  <h1>Hora de Vender! 🚀</h1>
  <p>Use o Reborn AI para potencializar suas vendas, bater metas e conquistar resultados extraordinários!</p>

  <form id="loginForm">
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Entrar no Reborn AI</button>
  </form>

  <textarea id="proposalText" placeholder="Escreva tema da proposta ou prompt..." rows="4"></textarea>
  <button id="generateProposal">Gerar Proposta Inteligente</button>

  <button id="openEbook">O que é o Reborn AI?</button>
  <button id="downloadPDF">Baixar Manual de Vendas</button>

  <div id="error" class="error"></div>
  <div id="proposalOutput"></div>
</div>

<div id="ebookModal" class="modal">
  <div class="modal-content">
    <span class="close-modal" id="closeEbook">&times;</span>
    <!-- slides do ebook aqui -->
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
let slidesSS=document.querySelectorAll('.slideshow img'), currentSS=0;
setInterval(()=>{ slidesSS[currentSS].classList.remove('active'); currentSS=(currentSS+1)%slidesSS.length; slidesSS[currentSS].classList.add('active'); },3000);

// Login
const loginForm=document.getElementById('loginForm');
const motivationalAudio=document.getElementById('motivationalAudio');
loginForm.addEventListener('submit', function(e){
  e.preventDefault();
  const pwd=document.getElementById('password').value.trim();
  if(pwd!=='reborn'){ document.getElementById('error').style.display='block'; document.getElementById('error').textContent='Password incorreta!'; return; }
  document.getElementById('error').style.display='none';
  motivationalAudio.play();
  window.location.href="https://v0-ai-gateway-starter-zetaa-oneee.vercel.app/";
});

// Modal eBook
const modal=document.getElementById('ebookModal');
document.getElementById('openEbook').addEventListener('click',()=>{ modal.style.display='flex'; });
document.getElementById('closeEbook').addEventListener('click',()=>{ modal.style.display='none'; });

// PDF Manual
document.getElementById('downloadPDF').addEventListener('click',()=>{
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF();
  doc.setFontSize(16); doc.setTextColor(0,255,255); doc.text("Manual de Vendas - Reborn AI",20,20);
  doc.setFontSize(12); doc.setTextColor(255,255,255);
  const manualText=`Manual de Vendas Reborn AI
1. Automatize tarefas repetitivas
2. Use templates para SMS e emails
3. Gere links de WhatsApp personalizados
4. Melhore a comunicação com clientes
5. Foco no fechamento de negócios e metas de vendas
6. Use marketing digital para aumentar alcance
7. Analise resultados e aprimore estratégias`;
  const lines=doc.splitTextToSize(manualText,170); doc.text(lines,20,40); doc.save("Manual_Vendas_RebornAI.pdf");
});

// Gerar Proposta com fallback
document.getElementById('generateProposal').addEventListener('click', async ()=>{
  const { jsPDF }=window.jspdf;
  const prompt=document.getElementById('proposalText').value.trim();
  if(!prompt){ alert('Escreva um prompt para gerar a proposta.'); return; }
  const outputDiv=document.getElementById('proposalOutput');
  outputDiv.textContent='Gerando proposta... Aguarde.';

  let generatedText='', imageUrl='';
  try {
    // Fallback 1 - HuggingFace GPT2
    let res1=await fetch("https://api-inference.huggingface.co/models/gpt2",{method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({inputs:prompt})});
    let data1=await res1.json();
    generatedText=data1[0]?.generated_text || '';
  } catch(e){ console.warn("Fallback 1 falhou, tentando Fallback 2"); }

  try {
    if(!generatedText){
      // Fallback 2 - DistilGPT2
      let res2=await fetch("https://api-inference.huggingface.co/models/distilgpt2",{method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({inputs:prompt})});
      let data2=await res2.json();
      generatedText=data2[0]?.generated_text || prompt;
    }
  } catch(e){ generatedText=prompt; console.warn("Fallback 2 falhou"); }

  try {
    // Tentar gerar imagem open-source
    let imgRes=await fetch(`https://backend.craiyon.com/generate`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt:prompt})
    });
    let imgData=await imgRes.json();
    imageUrl=imgData.images?.[0] || '';
  } catch(e){ console.warn("Erro ao gerar imagem, ignorando"); }

  // Gerar PDF final
  const doc=new jsPDF();
  doc.setFontSize(16); doc.setTextColor(0,255,255); doc.text("Proposta Inteligente - Reborn AI",20,20);
  doc.setFontSize(12); doc.setTextColor(255,255,255);
  const lines=doc.splitTextToSize(generatedText,170);
  doc.text(lines,20,40);
  if(imageUrl){ doc.addImage(imageUrl,'JPEG',15,100,180,100); }
  doc.save("Proposta_RebornAI.pdf");
  outputDiv.textContent='Proposta gerada com sucesso!';
});
</script>
</body>
</html>
